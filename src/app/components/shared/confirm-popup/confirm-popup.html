@if (activeConfig; as activeConfig) {
<div
  class="confirm-popup-overlay"
  (click)="onOverlayClick()"
  (touchstart)="onOverlayClick()"
></div>

<div #panel class="confirm-popup-panel">
  <h3 class="confirm-popup-title">{{ activeConfig.title }}</h3>
  @if (activeConfig.message) {
  <p class="confirm-popup-message">{{ activeConfig.message }}</p>
  }
  <div class="confirm-popup-actions">
    <span class="confirm-popup-action confirm-popup-cancel" (click)="onCancelClick()">
      {{ activeConfig.cancelText || "Annulla" }}
    </span>
    <span
      class="confirm-popup-action confirm-popup-confirm"
      [style.color]="activeConfig.confirmColor || '#ff6b6b'"
      (click)="onConfirmClick()"
    >
      {{ activeConfig.confirmText || "Conferma" }}
    </span>
  </div>
</div>
}
