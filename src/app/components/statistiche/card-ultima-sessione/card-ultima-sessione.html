@if (dati) {
<div class="stats-card" (click)="onClick()">
  <div class="card-body">
    <h3 class="text-white card-titolo">{{ dati.nomeGiorno }}</h3>
    <h3 class="text-grey">{{ dati.nomeScheda }}</h3>
    <h3 class="text-grey">
      Svolto il {{ dati.dataEsecuzione | date: "dd/MM/yyyy" }}
    </h3>
    <h3 class="text-grey">
      {{ dati.eserciziSvolti }} esercizi su {{ dati.eserciziPrevisti }}
    </h3>
  </div>
  <div class="arrow-widget-container">
    <mat-icon svgIcon="google-arrow"></mat-icon>
  </div>
</div>
}
