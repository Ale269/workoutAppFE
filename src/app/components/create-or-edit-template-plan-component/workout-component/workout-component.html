<div class="workout-detail-container">
  <!-- Scroller proprio della vista: la barra di pulsanti floating qui sotto
       (position: fixed) deve stargli FUORI, altrimenti su iOS ricade nella
       scroll view e toccarla durante uno scroll per inerzia lo blocca. -->
  <div class="page-scroller">
    <!-- Contenuto workout -->
    <div class="workout-content">
    <div class="section-title">
      <div class="text-section-container">
        <h2 class="text-title">Dati allenamento</h2>
      </div>
    </div>
    <div class="workout-data">
      <div class="nome-allenamento-container">
        <form [formGroup]="formAllenamento.form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Alias allenamento </mat-label>
            <input (change)="ifEmptySetPlaceholder($event)" matInput [type]="'text'" formControlName="nomeAllenamento"
              placeholder="Nome allenamento" />

            @if
            (this.formAllenamento.form.controls['nomeAllenamento'].hasError('required'))
            {
            <mat-error>Nome allenamento obbligatorio</mat-error>
            }
          </mat-form-field>
        </form>
      </div>
      <!-- <div class="ordinamento-container">
        <form [formGroup]="formAllenamento.form">
          <mat-form-field appearance="outline">
            <mat-label>Posizione</mat-label>
            <mat-select
              [formControl]="ordinamentoControl"
              [placeholder]="'Seleziona posizione'"
            >
              @for (position of formScheda.availableWorkoutPositions; let idx =
              $index; track idx) {
              <mat-option [value]="position">
                <div class="custom-option">
                  <span>Posizione {{ position }}</span>
                </div>
              </mat-option>
              }
            </mat-select>
            @if(ordinamentoControl.invalid && ordinamentoControl.touched){
            <mat-error> La posizione è obbligatoria </mat-error>
            }
          </mat-form-field>
        </form>
      </div> -->
    </div>

    <div class="section-title">
      <div class="text-section-container">
        <h2 class="text-title">Lista esercizi</h2>
        <div class="small-inline-button" (click)="toggleCompactMode()">
          <button>Riordina</button>
          <mat-icon svgIcon="google-reorder"></mat-icon>
        </div>
      </div>
    </div>

    <div #exerciseDataContainer
      [class.exercise-data]="this.formAllenamento.units && this.formAllenamento.units.length > 0">
      @for (unit of this.formAllenamento.units; track trackUnit(unit)) {
      @if (unit.kind === 'esercizio') {
      <div #exerciseCard class="exercise-wrapper">
        <app-exercise-component [formAllenamento]="formAllenamento" (onDeleteExercise)="deleteEexercise($event)"
          [formEsercizio]="unit.esercizio" [isCompactMode]="isCompactMode"></app-exercise-component>
      </div>
      } @else {
      <div #exerciseCard class="exercise-wrapper">
        <app-exercise-group [formAllenamento]="formAllenamento" [gruppo]="unit.gruppo"
          [numero]="unit.numero" [isCompactMode]="isCompactMode" (onDeleteExercise)="deleteEexercise($event)"
          (addExercise)="addEsercizioToGruppo($event)"></app-exercise-group>
      </div>
      } } @empty { }
    </div>
    <div class="add-exercise-button-row">
      <app-popup-option-button [label]="'Aggiungi'" [options]="addOptions"
        (optionSelected)="onAddOptionSelected($event)">
      </app-popup-option-button>
    </div>
    </div>
  </div>
  <div class="floating-double-buttons-container" #deleteWorkoutAnchor>
    <app-multi-option-button [leftButtonLabel]="''" [leftGroups]="leftButtonOptionsGroup"
      (optionSelected)="onOptionSelected($event)">
      <!-- Il pulsante statico viene proiettato qui -->
      <button class="floating-static-button" (touchstart)="backToList()">
        <span>Torna alla scheda</span>
      </button>
    </app-multi-option-button>
  </div>

  <!-- Fine workout-detail-container -->

  <ng-template #headerAddWorkout>
    <img src="assets/recollect/images/icona-add-workout.png" alt="Aggiungi Allenamento" class="add-workout-icon" />
  </ng-template>
</div>
